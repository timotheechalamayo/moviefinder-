name: Plakate und deutsche Texte holen
on:
  workflow_dispatch:
  push:
    paths: [tools/enrich.py, .github/workflows/enrich.yml]
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/enrich.py
      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/enrich.json
          git commit -m "Plakate und deutsche Texte aktualisiert" || exit 0
          git pull --rebase origin main
          git push
